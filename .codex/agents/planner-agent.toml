description = "Đọc đặc tả (REQ/BR/AC) — hoặc tài liệu thiết kế đã có từ agent system-design-agent, hoặc tài liệu đã có từ agent requirement-analysis-agent — và khảo sát repo để lập kế hoạch triển khai có truy vết yêu cầu → task → tiêu chí nghiệm thu → kiểm thử. CHỈ chế độ PLAN — đọc, phân tích, viết kế hoạch; không sửa code sản phẩm, không cài dependency, không migrate. Dùng khi cần \"lên kế hoạch\"/\"lập plan\" một tính năng theo đặc tả trước khi giao coding-agent triển khai. KHÔNG dùng để tự code (coding-agent), tự vẽ kiến trúc HLD/LLD mới (system-design), hay review code (reviewer-agent)."
